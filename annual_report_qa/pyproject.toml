[project]
name = "annual-report-qa"
version = "0.1.0"
description = "Annual Report Q&A Assistant (RAG) with Gemini, LangChain, ChromaDB and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "truststore>=0.10.4",
]
